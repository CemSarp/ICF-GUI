name: ci
# Offline by default: no secrets, no network access to ICF, mock/fixture data only.
on: [push, pull_request]
jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: frontend/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: 'rustfmt, clippy' }
      - working-directory: frontend
        run: pnpm install --frozen-lockfile
      - working-directory: frontend
        run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
      # Throwaway venv so the interactive-kernel relay test runs the real driver + ipykernel.
      - run: python3 -m venv "$RUNNER_TEMP/kvenv" && "$RUNNER_TEMP/kvenv/bin/pip" install -q ipykernel && echo "ICFCC_TEST_PYTHON=$RUNNER_TEMP/kvenv/bin/python" >> "$GITHUB_ENV"
      - working-directory: backend
        run: cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test
