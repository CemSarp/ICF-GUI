[package]
name = "icf-control-center"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "icf_control_center_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "net", "macros", "rt-multi-thread", "fs"] }
security-framework = "3"
zeroize = { version = "1", features = ["serde"] }
libc = "0.2"

[profile.release]
strip = true
lto = true
